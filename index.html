      body {
        margin: 0;
        padding: 0;

        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;

      html.dark,
      html.dark body {
        background-color: #0a0a0b !important;
        color: #f4f4f5;
      }
    </style>
    <!-- No inline scripts: the theme bootstrap lives in src/bootstrap.ts so the
         desktop app can run under a strict Content-Security-Policy. -->
