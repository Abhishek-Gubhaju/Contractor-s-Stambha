<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Stambha">
  <!--
    The one mark: the ink tile with the lucide "building-2" glyph used by the
    app's sidebar. The desktop icons are generated from this same file
    (`npx tauri icon src/assets/app-icon.svg`), so in-app and dock share artwork.

    Tile 860 of 1024 (macOS squircle margin), glyph 500 of 860 (the same
    proportion as 20px inside the 32px sidebar tile), stroke 2.6 so the outline
    is still ~2px when the icon is 32px.
  -->
  <rect x="82" y="82" width="860" height="860" rx="196" fill="#18181B"/>
  <g transform="translate(212 212) scale(25)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
    <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
    <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>
    <path d="M10 6h4"/>
    <path d="M10 10h4"/>
    <path d="M10 14h4"/>
    <path d="M10 18h4"/>
  </g>
</svg>
