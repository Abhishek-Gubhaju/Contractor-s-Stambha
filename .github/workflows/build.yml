name: Build desktop installers

# Builds the real installers for macOS, Windows and Linux on GitHub's own
# runners. Nothing is uploaded anywhere: each job attaches its installers to the
# workflow run, so they can be downloaded from the Actions page.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal build, Apple Silicon + Intel)
            platform: macos-latest
            rustTarget: universal-apple-darwin
            tauriArgs: --target universal-apple-darwin
            bundlePath: target/universal-apple-darwin/release/bundle
          - name: Windows (x64)
            platform: windows-latest
            rustTarget: x86_64-pc-windows-msvc
            tauriArgs: ""
            bundlePath: target/release/bundle
          - name: Linux (x64)
            platform: ubuntu-22.04
            rustTarget: x86_64-unknown-linux-gnu
            tauriArgs: ""
            bundlePath: target/release/bundle

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Tauri needs WebKitGTK and the tray/indicator libraries on Linux.
      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS binary needs both Apple architectures installed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rustTarget }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rustTarget }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      # Produces: .dmg + .app (macOS), .msi + NSIS .exe (Windows),
      # .deb + .rpm + .AppImage (Linux).
      - name: Build the installer
        run: npm run app:build -- ${{ matrix.tauriArgs }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: stambha-${{ matrix.rustTarget }}
          path: src-tauri/${{ matrix.bundlePath }}/**
          if-no-files-found: error
          retention-days: 30
